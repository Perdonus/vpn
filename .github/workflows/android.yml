name: Android

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build And Capture Logs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci-logs
          echo "Commit: ${GITHUB_SHA}" | tee ci-logs/context.txt
          echo "Workflow: ${GITHUB_WORKFLOW}" | tee -a ci-logs/context.txt
          echo "Runner: ${RUNNER_OS}" | tee -a ci-logs/context.txt
          ./gradlew --version | tee ci-logs/gradle-version.txt
          ./gradlew assembleDebug --console=plain --stacktrace --info 2>&1 | tee ci-logs/gradle-build.log

      - name: Collect Diagnostic Files
        if: always()
        shell: bash
        run: |
          set -eux
          mkdir -p ci-logs/gradle-daemon
          find "$HOME/.gradle/daemon" -name 'daemon-*.out.log' -type f -exec cp {} ci-logs/gradle-daemon/ \; || true

      - name: Summarize Build Failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          summary_file="ci-logs/gradle-error-summary.txt"
          mkdir -p ci-logs

          if [[ ! -f ci-logs/gradle-build.log ]]; then
            echo "Gradle build log was not captured." > "$summary_file"
          elif grep -En '(^e: file:|^e: |^FAILURE: Build failed|^\* What went wrong:|^Execution failed|^A failure occurred|^> )' ci-logs/gradle-build.log > "$summary_file"; then
            true
          else
            tail -n 200 ci-logs/gradle-build.log > "$summary_file"
          fi

          first_error="$(head -n 1 "$summary_file" || true)"
          if [[ -n "$first_error" ]]; then
            echo "::error title=Gradle build failed::$first_error"
          fi

          {
            echo "## Build Failure Summary"
            echo
            echo '```text'
            cat "$summary_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: whitevpn-debug-logs
          path: |
            ci-logs/**
            app/build/reports/**
            app/build/outputs/logs/**
            app/build/intermediates/merged_manifest*/**
            app/build/tmp/**

      - name: Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: whitevpn-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk

      - name: Publish Debug Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
          APK_NAME: WhiteVPN-debug-${{ github.run_number }}.apk
          TAG_NAME: debug-${{ github.run_number }}
          RELEASE_NAME: WhiteVPN Debug #${{ github.run_number }}
        with:
          script: |
            const fs = require('fs')
            const apkPath = process.env.APK_PATH
            const apkName = process.env.APK_NAME
            const tagName = process.env.TAG_NAME
            const releaseName = process.env.RELEASE_NAME
            const { owner, repo } = context.repo

            if (!fs.existsSync(apkPath)) {
              core.setFailed(`APK not found at ${apkPath}`)
              return
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tagName,
              name: releaseName,
              prerelease: true,
              generate_release_notes: false,
              body: `Debug build for ${context.sha}`,
            })

            const apkData = fs.readFileSync(apkPath)
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name: apkName,
              data: apkData,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': apkData.length,
              },
            })

            core.notice(`Release URL: ${release.data.html_url}`)
